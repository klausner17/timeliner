server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # IP real de quem acessa, quando há outro proxy na frente (ex.: o do domínio).
    # REAL_IP_FROM é a rede desse proxy; só dele o X-Forwarded-For é aceito. Sem
    # isso, todo mundo pareceria ter o IP do proxy e os limites de cadastro e login
    # da API valeriam para o site inteiro de uma vez.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cabeçalhos de segurança. add_header dentro de um location apaga os de fora,
    # então cada location inclui o mesmo arquivo.
    include /etc/nginx/conf.d/security-headers.inc;

    # /api vai para o backend Go, no mesmo endereço do site.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O router usa history mode: rotas desconhecidas caem no index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
