name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timeliner
          POSTGRES_PASSWORD: timeliner
          POSTGRES_DB: timeliner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U timeliner"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Testes (repositório em memória)
        run: go test ./...
      - name: Testes (Postgres)
        # -p 1: os pacotes limpam o mesmo banco de teste
        run: go test -count=1 -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://timeliner:timeliner@localhost:5432/timeliner_test?sslmode=disable
