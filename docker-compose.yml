# Sobe o Timeliner inteiro: Postgres, API em Go e frontend servido pelo nginx.
# Uso: docker compose up --build  ->  http://localhost:8000
# Usuário de dev (seed): docker compose --profile dev up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timeliner
      POSTGRES_PASSWORD: timeliner
      POSTGRES_DB: timeliner
    # Só na própria máquina: o Docker publica portas por cima do firewall, e a senha
    # do banco aqui é a de dev. POSTGRES_BIND=0.0.0.0 abre para a rede.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timeliner -d timeliner"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://timeliner:timeliner@postgres:5432/timeliner?sslmode=disable
      # E-mails de confirmação e senha: sem RESEND_API_KEY, os links aparecem no log da API.
      # Obrigatório com RESEND_API_KEY: endereço público do site (ex.: https://klausner.site/app/timeliner).
      APP_URL: ${APP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Timeliner <onboarding@resend.dev>}
    # Só na própria máquina: a API confia no X-Real-IP posto pelo nginx, então quem
    # chegasse direto nela poderia inventar o IP e passar dos limites de cadastro e login.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_UPSTREAM: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Cria o usuário de dev (klausner@gmail.com / timeliner123) pela API, uma vez.
  # Se o usuário já existir, o cadastro falha e o serviço só avisa. Só sobe com
  # --profile dev, para nunca criar uma conta de senha conhecida em produção.
  seed:
    profiles: ["dev"]
    image: alpine:3.22
    depends_on:
      backend:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        wget -qO- --header 'Content-Type: application/json'
        --post-data '{"handle":"klausner","name":"Klausner","email":"klausner@gmail.com","password":"timeliner123"}'
        http://backend:8080/api/auth/register && echo ' usuario criado'
        || echo 'usuario ja existe'
    restart: "no"

volumes:
  pgdata:
